<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MEFS® 검사자 자격 시험 · StoryLine</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
:root{
  --teal:#12A392; --teal-deep:#0B7E71; --teal-tint:#E7F6F3; --teal-line:#BEE6DF;
  --ink:#101614; --ink-2:#48544F; --ink-3:#8A968F;
  --paper:#FFFFFF; --shell:#F4F7F5; --line:#E3E9E5;
  --warn:#C2543F; --warn-tint:#FBEDE9;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  background:var(--shell); color:var(--ink);
  font-size:16px; line-height:1.6; letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;
  word-break:keep-all;
}
.wrap{max-width:760px;margin:0 auto;padding:28px 20px 72px}
.micro{
  font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--teal);
  text-transform:uppercase;
}
.micro.muted{color:var(--ink-3)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:26px 24px}
hr.rule{border:0;border-top:2px solid var(--teal);margin:12px 0 22px;width:64px}

/* ---------- header ---------- */
header.brand{display:flex;align-items:baseline;gap:10px;margin-bottom:26px}
header.brand .mark{font-size:19px;font-weight:800;letter-spacing:-.03em}
header.brand .mark span{color:var(--teal)}
header.brand .tag{font-size:12px;color:var(--ink-3);letter-spacing:.02em}

/* ---------- home ---------- */
h1{font-size:30px;line-height:1.28;font-weight:800;letter-spacing:-.035em;margin:6px 0 10px}
.lede{color:var(--ink-2);font-size:15px;margin:0 0 24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px;letter-spacing:.01em}
.field input{
  width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
  font:inherit;font-size:15px;background:#fff;color:var(--ink)
}
.field input:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:transparent}

.modlist{margin-top:26px;display:grid;gap:10px}
.mod{
  display:flex;align-items:center;gap:16px;width:100%;text-align:left;cursor:pointer;
  background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px;
  font:inherit;color:inherit;transition:border-color .15s,transform .15s,background .15s
}
.mod:hover{border-color:var(--teal);transform:translateY(-1px)}
.mod:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.mod .num{
  font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--teal);
  background:var(--teal-tint);border-radius:8px;padding:8px 10px;min-width:44px;text-align:center
}
.mod.is-final .num{background:var(--ink);color:#fff}
.mod .body{flex:1;min-width:0}
.mod .body b{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em}
.mod .body small{display:block;color:var(--ink-3);font-size:12.5px;margin-top:2px}
.mod .arrow{color:var(--ink-3);font-size:18px}
.mod .done{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--teal-deep)}
.mod .fail{color:var(--warn)}

.notebox{
  margin-top:26px;background:var(--teal-tint);border-radius:12px;padding:18px 20px;
  font-size:13.5px;color:var(--ink-2)
}
.notebox b{color:var(--ink)}
.notebox ul{margin:8px 0 0;padding-left:18px}
.notebox li{margin:3px 0}

/* ---------- quiz ---------- */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.qhead .who{font-size:12px;color:var(--ink-3)}
.bar{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:26px}
.bar > i{display:block;height:100%;background:var(--teal);width:0;transition:width .35s cubic-bezier(.4,0,.2,1)}
.qnum{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--teal)}
.qtext{font-size:20px;line-height:1.5;font-weight:700;letter-spacing:-.025em;margin:10px 0 4px}
.qnote{font-size:13px;color:var(--warn);background:var(--warn-tint);border-radius:8px;padding:8px 12px;margin:12px 0 0}
.opts{margin:22px 0 0;display:grid;gap:9px}
.opt{
  display:flex;gap:13px;align-items:flex-start;cursor:pointer;
  border:1px solid var(--line);border-radius:11px;padding:14px 16px;background:#fff;
  font:inherit;text-align:left;color:inherit;transition:border-color .12s,background .12s
}
.opt:hover{border-color:var(--teal-line);background:#FCFEFD}
.opt.sel{border-color:var(--teal);background:var(--teal-tint)}
.opt:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.opt .box{
  flex:none;width:20px;height:20px;border:1.5px solid #C6D0CB;border-radius:50%;margin-top:2px;
  display:grid;place-items:center;transition:.12s
}
.opt[data-multi="1"] .box{border-radius:6px}
.opt.sel .box{border-color:var(--teal);background:var(--teal)}
.opt.sel .box::after{content:'';width:8px;height:8px;border-radius:50%;background:#fff}
.opt[data-multi="1"].sel .box::after{
  content:'';width:10px;height:6px;border:2px solid #fff;border-top:0;border-right:0;
  border-radius:1px;background:none;transform:rotate(-45deg) translate(1px,-1px)
}
.opt .txt{font-size:15.5px;line-height:1.5}

/* matching */
.matchrow{border:1px solid var(--line);border-radius:11px;padding:14px 16px;background:#fff}
.matchrow + .matchrow{margin-top:9px}
.matchrow p{margin:0 0 10px;font-size:15px;line-height:1.5}
.matchrow select{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;
  font:inherit;font-size:14.5px;background:#fff;color:var(--ink)
}
.matchrow select:focus{outline:2px solid var(--teal);outline-offset:1px}

.actions{margin-top:26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn{
  border:0;border-radius:10px;padding:14px 26px;font:inherit;font-size:15px;font-weight:700;
  letter-spacing:-.01em;cursor:pointer;background:var(--teal);color:#fff;transition:background .12s
}
.btn:hover{background:var(--teal-deep)}
.btn:disabled{background:#CBD5D0;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.btn.ghost:hover{background:#fff;border-color:var(--ink-3)}
.btn:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.hint{font-size:12.5px;color:var(--ink-3)}

/* ---------- result ---------- */
.score{display:flex;align-items:baseline;gap:6px;margin:8px 0 2px}
.score b{font-size:64px;font-weight:800;letter-spacing:-.05em;line-height:1}
.score i{font-size:22px;font-weight:700;font-style:normal;color:var(--ink-3)}
.verdict{font-size:22px;font-weight:800;letter-spacing:-.03em;margin:14px 0 6px}
.pass .verdict,.pass .score b{color:var(--teal-deep)}
.fail .verdict,.fail .score b{color:var(--warn)}
.meta{font-size:14px;color:var(--ink-2);margin:0}
.codebox{
  margin-top:22px;border:1px dashed var(--teal-line);background:var(--teal-tint);
  border-radius:11px;padding:16px 18px
}
.codebox .micro{margin-bottom:6px;display:block}
.codebox code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:17px;font-weight:700;
  letter-spacing:.06em;color:var(--ink)
}
.idbox{
  margin-top:18px;padding:14px 16px;background:var(--teal-tint);border-radius:10px
}
.idbox .micro{display:block;margin-bottom:5px}
.idbox code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:17px;font-weight:700;
  letter-spacing:.04em;color:var(--ink)
}
.idbox small{display:block;margin-top:7px;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.sendbox{
  margin-top:14px;font-size:13.5px;color:var(--ink-2);display:flex;align-items:center;
  gap:9px;flex-wrap:wrap;line-height:1.5
}
.sendbox .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink-3)}
.sendbox .dot.sending{background:var(--teal);animation:pulse 1.1s ease-in-out infinite}
.sendbox .dot.ok{background:var(--teal)}
.sendbox .dot.err{background:var(--warn)}
.sendbox.error{color:var(--warn)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.linkbtn{
  border:0;background:none;padding:0;font:inherit;font-size:13.5px;font-weight:700;
  color:var(--teal-deep);text-decoration:underline;cursor:pointer
}
footer.foot{
  margin-top:36px;padding-top:18px;border-top:1px solid var(--line);
  font-size:10.5px;letter-spacing:.14em;color:var(--ink-3);text-align:center
}
@media (max-width:520px){
  .wrap{padding:20px 15px 56px}
  h1{font-size:25px}
  .qtext{font-size:18px}
  .score b{font-size:52px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const S = { name:"", tail:"", mod:null, order:[], idx:0,
            answers:[], results:{}, send:"idle", lastRow:null, tick:null };
const app = document.getElementById("app");

/* ---------- 유틸 ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
async function sha256(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
/* 응시자 ID = 이름(공백 제거) + '-' + 연락처 끝 4자리 */
const uid = () => S.name.replace(/\s+/g,"") + "-" + S.tail;

/* 로컬 대기 기록 — 서버 확인이 불가능할 때의 보조 수단 */
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
const coolKey = (id, mod) => "mefs.cool." + id + "." + mod;

function remainText(ms){
  const h = Math.floor(ms/3600000), m = Math.floor(ms%3600000/60000), s = Math.floor(ms%60000/1000);
  if(h > 0) return `${h}시간 ${m}분`;
  if(m > 0) return `${m}분 ${s}초`;
  return `${s}초`;
}
function whenText(ts){
  const d = new Date(ts);
  return d.toLocaleString("ko-KR", { month:"long", day:"numeric", hour:"numeric", minute:"2-digit" });
}

const brandHead = `<header class="brand"><div class="mark">Story<span>Line</span></div>
  <div class="tag">MEFS® 검사자 자격 시험</div></header>`;
const footer = `<footer class="foot">PLAYTAG &nbsp;×&nbsp; REFLECTION SCIENCES</footer>`;

/* ============================================================
   홈 화면
   ============================================================ */
function renderHome(){
  const cards = DATA.map(m=>{
    const r = S.results[m.id];
    let badge = `<span class="arrow">→</span>`;
    if(r) badge = `<span class="done ${r.pass?'':'fail'}">${r.pct}% · ${r.pass?'합격':'재응시 필요'}</span>`;
    return `<button class="mod ${m.final?'is-final':''}" data-mod="${m.id}">
      <span class="num">${m.final?'FINAL':m.no}</span>
      <span class="body"><b>${esc(m.sub)}</b><small>${esc(m.title)} · ${m.q.length}문항 · 통과 기준 80%</small></span>
      ${badge}
    </button>`;
  }).join("");

  app.innerHTML = `${brandHead}
  <div class="micro">MEFS KOREA &nbsp;×&nbsp; PLAYTAG</div>
  <hr class="rule">
  <h1>실행기능평가<br>검사자 자격 시험</h1>
  <p class="lede">모듈 퀴즈 4종과 최종 인증 시험으로 구성됩니다. 각 시험에서 80% 이상을 획득해야 통과하며,
  최종 인증 시험까지 통과하면 MEFS® 공인 검사자 자격이 부여됩니다.</p>

  <div class="card">
    <div class="field"><label for="nm">이름</label><input id="nm" value="${esc(S.name)}" placeholder="홍길동" autocomplete="name"></div>
    <div class="field"><label for="tl">휴대폰 뒤 4자리</label>
      <input id="tl" value="${esc(S.tail)}" placeholder="1234" inputmode="numeric" maxlength="4" autocomplete="off"></div>
    <div class="idbox">
      <span class="micro">응시자 ID</span>
      <code id="idprev">—</code>
      <small>이름과 뒤 4자리를 합친 값이 응시 기록의 식별자가 됩니다. 모든 시험에서 같은 값을 입력해 주세요.</small>
    </div>
  </div>

  <div class="modlist">${cards}</div>

  <div class="notebox">
    <b>응시 전에 확인해 주세요</b>
    <ul>
      <li>문항은 한 번에 하나씩 제시되며, <b>이전 문항으로 돌아갈 수 없습니다.</b></li>
      <li>답을 선택한 뒤 '다음'을 누르면 그 문항은 확정됩니다.</li>
      <li>결과는 마지막에 점수(%)로만 표시되며, 정답은 공개되지 않습니다.</li>
      <li><b>80% 미만이면 ${COOLDOWN_H}시간 뒤에 재응시할 수 있습니다.</b> 대기 시간 동안 학습 자료를 다시 확인해 주세요.</li>
      <li>재응시 시 문항과 선택지 순서가 바뀝니다.</li>
    </ul>
  </div>
  ${footer}`;

  const $nm = document.getElementById("nm"), $tl = document.getElementById("tl"),
        $id = document.getElementById("idprev");
  const paintId = () => {
    const n = $nm.value.trim().replace(/\s+/g,""), t = $tl.value.trim();
    $id.textContent = (n && t.length===4) ? n + "-" + t : "—";
  };
  $nm.oninput = e => { S.name = e.target.value; paintId(); };
  $tl.oninput = e => { e.target.value = e.target.value.replace(/\D/g,"").slice(0,4); S.tail = e.target.value; paintId(); };
  paintId();

  app.querySelectorAll(".mod").forEach(b=>{
    b.onclick = () => {
      S.name = $nm.value.trim(); S.tail = $tl.value.trim();
      if(!S.name){ $nm.focus(); alert("이름을 입력해 주세요."); return; }
      if(S.tail.length !== 4){ $tl.focus(); alert("휴대폰 뒤 4자리를 입력해 주세요."); return; }
      gate(b.dataset.mod);
    };
  });
}

/* ============================================================
   응시 자격 확인 — 불합격 후 COOLDOWN_H 시간 대기
   서버(Apps Script) 기록을 우선 확인하고, 확인이 불가능하면
   브라우저에 남은 로컬 기록으로 대체 판정합니다.
   ============================================================ */
function gate(modId){
  const m = DATA.find(x=>x.id===modId);
  const id = uid();

  const localUntil = () => {
    const v = Number(store.get(coolKey(id, modId)) || 0);
    return (v && v > Date.now()) ? v : 0;
  };

  if(!RECORD_URL){
    const u = localUntil();
    return u ? renderBlocked(m, u, "local") : startQuiz(modId);
  }

  renderChecking(m);
  ask({ action:"check", uid:id, module:modId }, res => {
    if(res && res.ok){
      if(res.blockedUntil) return renderBlocked(m, res.blockedUntil, "server");
      return startQuiz(modId);
    }
    const u = localUntil();
    return u ? renderBlocked(m, u, "local") : startQuiz(modId);
  });
}

function renderChecking(m){
  app.innerHTML = `${brandHead}
  <div class="micro">${m.final?'FINAL · EFGO™ CERTIFICATION':'QUIZ '+m.no}</div>
  <hr class="rule">
  <div class="card">
    <div class="sendbox sending"><span class="dot sending"></span>응시 자격을 확인하는 중입니다…</div>
  </div>
  ${footer}`;
}

function renderBlocked(m, until, source){
  if(S.tick) clearInterval(S.tick);
  app.innerHTML = `${brandHead}
  <div class="micro muted">RETAKE ON HOLD · 재응시 대기</div>
  <hr class="rule">
  <div class="card fail">
    <div class="verdict">아직 재응시할 수 없습니다</div>
    <p class="meta">${esc(m.sub)}에서 통과 기준에 도달하지 못했습니다.
    학습 내용을 다시 확인할 수 있도록 ${COOLDOWN_H}시간의 대기 시간이 적용됩니다.</p>
    <div class="codebox">
      <span class="micro">남은 시간</span>
      <code id="cd">—</code>
      <p class="meta" style="margin-top:10px">${whenText(until)}부터 응시할 수 있습니다.</p>
    </div>
    ${source === "local" ? `<p class="hint" style="margin-top:14px">이 브라우저에 남은 기록을 기준으로 안내하고 있습니다.</p>` : ""}
    <div class="actions"><button class="btn ghost" id="home">시험 목록으로</button></div>
  </div>
  ${footer}`;
  document.getElementById("home").onclick = () => { clearInterval(S.tick); renderHome(); };
  const cd = document.getElementById("cd");
  const paint = () => {
    const left = until - Date.now();
    if(left <= 0){ clearInterval(S.tick); cd.textContent = "지금 응시할 수 있습니다"; return; }
    cd.textContent = remainText(left);
  };
  paint();
  S.tick = setInterval(paint, 1000);
  window.scrollTo(0,0);
}

/* ============================================================
   시험 진행
   ============================================================ */
function startQuiz(modId){
  const m = DATA.find(x=>x.id===modId);
  S.mod = m;
  S.order = shuffle(m.q.map((q,i)=>({...q, oi:i})));
  S.order = S.order.map(q=>{
    if(q.k === "match"){
      return {...q, rmap: shuffle(q.R.map((t,i)=>({t,i})))};
    }
    const opts = q.o.map((t,i)=>({t,i}));
    return {...q, omap: q.fx ? opts : shuffle(opts)};
  });
  S.idx = 0;
  S.answers = [];
  renderQuestion();
  window.scrollTo(0,0);
}

function renderQuestion(){
  const m = S.mod, q = S.order[S.idx], n = S.order.length;
  const pct = Math.round((S.idx / n) * 100);
  let sel = [];
  let body;

  if(q.k === "match"){
    const opts = q.rmap.map(o=>`<option value="${o.i}">${esc(o.t)}</option>`).join("");
    body = `<div class="opts">` + q.L.map((l,li)=>`
      <div class="matchrow">
        <p>${esc(l)}</p>
        <select data-li="${li}">
          <option value="">— 연령 집단 선택 —</option>${opts}
        </select>
      </div>`).join("") + `</div>`;
  } else {
    const multi = q.k === "multi" ? 1 : 0;
    body = `<div class="opts">` + q.omap.map(o=>`
      <button class="opt" data-multi="${multi}" data-i="${o.i}">
        <span class="box"></span><span class="txt">${esc(o.t)}</span>
      </button>`).join("") + `</div>`;
  }

  app.innerHTML = `${brandHead}
  <div class="qhead">
    <div class="micro">${m.final?'FINAL · EFGO™ CERTIFICATION':'QUIZ '+m.no} &nbsp;·&nbsp; ${S.idx+1} / ${n}</div>
    <div class="who">${esc(S.name)} · ${esc(uid())}</div>
  </div>
  <div class="bar"><i style="width:${pct}%"></i></div>

  <div class="card">
    <div class="qnum">${String(S.idx+1).padStart(2,"0")} / ${String(n).padStart(2,"0")}</div>
    <p class="qtext">${esc(q.t)}</p>
    ${q.n ? `<p class="qnote">${esc(q.n)}</p>` : ""}
    ${body}
  </div>

  <div class="actions">
    <button class="btn" id="next" disabled>${S.idx+1===n ? "제출하고 채점하기" : "다음 문항"}</button>
    <span class="hint">이전 문항으로는 돌아갈 수 없습니다.</span>
  </div>
  ${footer}`;

  const next = document.getElementById("next");

  if(q.k === "match"){
    const sels = [...app.querySelectorAll("select")];
    const check = () => { next.disabled = sels.some(s=>s.value===""); };
    sels.forEach(s => s.onchange = check);
    next.onclick = () => submitAnswer(sels.map(s=>Number(s.value)));
  } else {
    const btns = [...app.querySelectorAll(".opt")];
    btns.forEach(b=>{
      b.onclick = () => {
        const i = Number(b.dataset.i);
        if(q.k === "multi"){
          if(sel.includes(i)) sel = sel.filter(x=>x!==i); else sel.push(i);
          b.classList.toggle("sel");
        } else {
          sel = [i];
          btns.forEach(x=>x.classList.remove("sel"));
          b.classList.add("sel");
        }
        next.disabled = sel.length === 0;
      };
    });
    next.onclick = () => submitAnswer(q.k === "match" ? sel : sel.slice().sort((a,b)=>a-b));
  }
  window.scrollTo(0,0);
}

function submitAnswer(payload){
  const q = S.order[S.idx];
  const canon = q.k === "match" ? payload.join(";") : payload.join(",");
  S.answers.push({ oi:q.oi, canon });
  S.idx++;
  if(S.idx < S.order.length) renderQuestion(); else grade();
}

/* ============================================================
   채점
   ============================================================ */
async function grade(){
  const m = S.mod;
  let correct = 0;
  for(const a of S.answers){
    const hash = await sha256(SALT + "|" + m.id + "#" + a.oi + "#" + a.canon);
    if(hash === m.q[a.oi].h) correct++;
  }
  const total = m.q.length;
  const pct = Math.round((correct/total)*1000)/10;
  const pass = (correct/total) >= PASS_MARK - 1e-9;
  S.results[m.id] = { pct: (pct % 1 === 0 ? pct.toFixed(0) : pct.toFixed(1)), pass, correct, total };
  const code = await makeCode(m.id, correct, total, pass);
  if(!pass) store.set(coolKey(uid(), m.id), String(Date.now() + COOLDOWN_H*3600000));
  S.lastRow = {
    uid: uid(), name: S.name, tail: S.tail,
    module: m.id, moduleName: m.sub,
    correct, total, pct, pass: pass ? "합격" : "불합격", code
  };
  S.send = RECORD_URL ? "sending" : "off";
  renderResult(code);
  if(RECORD_URL) send();
}

async function makeCode(modId, correct, total, pass){
  const d = new Date();
  const ymd = d.getFullYear().toString().slice(2) + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0");
  const h = await sha256([SALT, uid(), modId, correct, total, ymd].join("|"));
  return `${modId.toUpperCase()}-${ymd}-${h.slice(0,6).toUpperCase()}-${pass?"P":"R"}`;
}

/* JSONP 요청 — CORS 제약 없이 응답까지 받을 수 있습니다. */
function ask(params, done){
  const cb = "mefscb_" + Date.now() + Math.floor(Math.random()*10000);
  const qs = new URLSearchParams({ ...params, callback: cb }).toString();
  const tag = document.createElement("script");
  let settled = false;
  const finish = res => {
    if(settled) return; settled = true;
    delete window[cb]; tag.remove(); clearTimeout(timer);
    done(res);
  };
  window[cb] = res => finish(res);
  tag.onerror = () => finish(null);
  const timer = setTimeout(() => finish(null), 12000);
  tag.src = RECORD_URL + (RECORD_URL.includes("?") ? "&" : "?") + qs;
  document.body.appendChild(tag);
}

function send(){
  S.send = "sending"; paintSend();
  ask({ action:"record", ...S.lastRow }, res => {
    S.send = (res && res.ok) ? "ok" : "error";
    paintSend();
  });
}

function paintSend(){
  const el = document.getElementById("sendbox");
  if(!el) return;
  const map = {
    sending: `<span class="dot sending"></span>응시 기록을 전송하는 중입니다…`,
    ok:      `<span class="dot ok"></span>응시 기록이 담당자에게 전송되었습니다.`,
    error:   `<span class="dot err"></span>기록 전송에 실패했습니다. 아래 결과 코드를 담당자에게 직접 전달해 주세요. <button class="linkbtn" id="resend">다시 전송</button>`
  };
  el.className = "sendbox " + S.send;
  el.innerHTML = map[S.send] || "";
  const rb = document.getElementById("resend");
  if(rb) rb.onclick = send;
}

function renderResult(code){
  const m = S.mod, r = S.results[m.id];
  app.innerHTML = `${brandHead}
  <div class="micro muted">RESULT &nbsp;·&nbsp; ${m.final?'최종 인증 시험':'모듈 '+m.no+' 퀴즈'}</div>
  <hr class="rule">
  <div class="card ${r.pass?'pass':'fail'}">
    <div class="score"><b>${r.pct}</b><i>%</i></div>
    <p class="meta">${r.total}문항 중 ${r.correct}문항 정답 · 통과 기준 80%</p>
    <div class="verdict">${r.pass ? (m.final ? "합격 · MEFS® 공인 검사자 자격 취득" : "통과 · 다음 모듈로 진행하세요") : "재응시가 필요합니다"}</div>
    <p class="meta">${r.pass
      ? "아래 결과 코드를 교육 담당자에게 전달해 주세요."
      : `해당 모듈 학습 내용을 다시 확인한 뒤 재응시해 주세요. 정답은 공개되지 않습니다.
         <br><b>${whenText(Date.now() + COOLDOWN_H*3600000)}</b>부터 다시 응시할 수 있습니다.`}</p>

    <div class="codebox">
      <span class="micro">RESULT CODE · 결과 코드</span>
      <code>${code}</code>
    </div>

    ${S.send === "off" ? "" : `<div class="sendbox" id="sendbox"></div>`}

    <div class="actions">
      <button class="btn ${r.pass?'':'ghost'}" id="retry">${r.pass ? "다시 응시하기" : `${COOLDOWN_H}시간 뒤 재응시`}</button>
      <button class="btn ${r.pass?'ghost':''}" id="home">시험 목록으로</button>
    </div>
  </div>
  ${footer}`;
  document.getElementById("retry").onclick = () => gate(m.id);
  document.getElementById("home").onclick = renderHome;
  paintSend();
  window.scrollTo(0,0);
}

/* 진행 중 이탈 방지 */
window.addEventListener("beforeunload", e => {
  if(S.mod && S.idx > 0 && S.idx < S.order.length){ e.preventDefault(); e.returnValue = ""; }
});

renderHome();
</script>
